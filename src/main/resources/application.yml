server:
  port: 8080

spring:
  application:
    name: api-polizas
  datasource:
    url: jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  api-key: "123456"
  ipc-increment: 0.05

logging:
  level:
    com.prueba.polizas: INFO
    ROOT: INFO
